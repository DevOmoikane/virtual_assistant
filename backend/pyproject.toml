[project]
name = "virtual-assistant-backend"
version = "0.1.0"
description = "This is the backend server for the virtual assistant in godot, it communicates through websockets and gets context data through chromadb, with capabilities of LLM, STT and TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "chromadb",
    "faster-whisper",
    "sounddevice",
    "numpy",
    "requests",
    "piper-tts",
    "opencv-python",
    "mediapipe",
    "insightface",
    "PyMuPDF",
    "python-docx",
    "odfpy",
    "python-multipart",
    "pyyaml",
    "opensearch-py",
    "turbovec",
    "rank-bm25",
    "mcp>=1.0.0",
    "pipecat-ai[kokoro,local,piper,silero,whisper]>=1.2.1",
    "supertonic>=1.3.1",
    "mcp>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
